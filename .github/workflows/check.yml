name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Pull requests cancel superseded runs; every main push keeps its own run.
concurrency:
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Pin npm registry client
        run: npm install --global npm@11.19.0 --ignore-scripts --registry=https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run check

  site:
    name: Site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install site dependencies
        working-directory: site
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Read the Playwright version
        id: playwright
        working-directory: site
        run: echo "version=$(node -p 'require("playwright-core/package.json").version')" >> "$GITHUB_OUTPUT"
      # Pull requests only restore the browser cache; main saves it.
      - name: Restore Chromium
        id: chromium-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: site-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Download Chromium and its system packages while the site builds.
      - name: Start the Chromium install
        working-directory: site
        run: |
          (
            status=0
            node node_modules/playwright-core/cli.js install --with-deps chromium > "$RUNNER_TEMP/chromium-install.log" 2>&1 || status=$?
            echo "$status" > "$RUNNER_TEMP/chromium-install.status"
          ) < /dev/null > /dev/null 2>&1 &
      - name: Check the site
        working-directory: site
        env:
          # `bun run check` runs typecheck before build, so the build skips its repeat pass.
          HRANESS_TYPECHECKED: "1"
        run: bun run check
      - name: Finish the Chromium install
        timeout-minutes: 5
        run: |
          until [[ -f "$RUNNER_TEMP/chromium-install.status" ]]; do sleep 1; done
          cat "$RUNNER_TEMP/chromium-install.log"
          exit "$(cat "$RUNNER_TEMP/chromium-install.status")"
      - name: Show the Chromium install log
        if: failure()
        run: cat "$RUNNER_TEMP/chromium-install.log" 2>/dev/null || true
      - name: Save Chromium
        if: github.ref == 'refs/heads/main' && steps.chromium-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.chromium-cache.outputs.cache-primary-key }}
      - name: Check public pages in a browser
        working-directory: site
        env:
          SITE_BROWSER_ARTIFACTS: ${{ runner.temp }}/site-browser
        run: node scripts/verify-site-browser.mjs
      - name: Save public page screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-browser
          path: ${{ runner.temp }}/site-browser
          retention-days: 7
      - name: Require the committed landing copy to match the README
        run: git diff --exit-code -- site/app/landing.generated.ts

  # Decide which path-filtered jobs this event needs.
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      windows-install: ${{ steps.filter.outputs.windows-install }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Match changed paths
        id: filter
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # A new branch or a missing base runs everything.
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "windows-install=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE" HEAD | grep -Eq '^(site/published-release\.json|site/components/skill-install\.tsx|\.github/workflows/check\.yml|skills/|package\.json$|VERSION$)'; then
            echo "windows-install=true" >> "$GITHUB_OUTPUT"
          else
            echo "windows-install=false" >> "$GITHUB_OUTPUT"
          fi

  # soulscrape.com shows Windows users this exact command under PowerShell.
  windows-install:
    name: Windows skill install
    needs: changes
    if: needs.changes.outputs.windows-install == 'true'
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: site/published-release.json
          sparse-checkout-cone-mode: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Cache the Bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\.bun\install\cache
          key: windows-skill-install-${{ hashFiles('site/published-release.json') }}
      - name: Run the published install command
        env:
          CI: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Get-Content site/published-release.json -Raw | ConvertFrom-Json
          $command = $release.skillInstall
          if (-not $command) { throw 'site/published-release.json has no skillInstall' }
          $project = Join-Path $env:RUNNER_TEMP 'skill-install'
          New-Item -ItemType Directory -Path $project | Out-Null
          Set-Location $project
          Write-Host "> $command -y"
          $parts = $command -split ' '
          & $parts[0] @($parts[1..($parts.Length - 1)] + '-y')
          if ($LASTEXITCODE -ne 0) { throw "install exited with $LASTEXITCODE" }
          $skill = Join-Path $project ".agents\skills\$($release.skill)\SKILL.md"
          if (-not (Test-Path $skill)) {
            Get-ChildItem -Recurse -Force $project | Select-Object -ExpandProperty FullName
            throw "missing $skill"
          }
          if (-not (Select-String -Path $skill -Pattern "^name: $($release.skill)$" -Quiet)) {
            throw "$skill does not name the $($release.skill) skill"
          }
          Write-Host "Installed $skill"

  required:
    name: Required
    if: always()
    needs: [check, site, changes, windows-install]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected job
        env:
          CHECK: ${{ needs.check.result }}
          SITE: ${{ needs.site.result }}
          CHANGES: ${{ needs.changes.result }}
          WINDOWS_INSTALL: ${{ needs.windows-install.result }}
          WINDOWS_INSTALL_SELECTED: ${{ needs.changes.outputs.windows-install }}
        run: |
          set -euo pipefail
          for result in "$CHECK" "$SITE" "$CHANGES"; do
            if [[ "$result" != success ]]; then
              printf 'Unexpected required job result: %s\n' "$result"
              exit 1
            fi
          done
          # The Windows install job may skip only when its paths did not change.
          if [[ "$WINDOWS_INSTALL_SELECTED" == true && "$WINDOWS_INSTALL" != success ]] \
            || [[ "$WINDOWS_INSTALL_SELECTED" != true && "$WINDOWS_INSTALL" != skipped ]]; then
            printf 'Unexpected Windows install result: %s (selected: %s)\n' "$WINDOWS_INSTALL" "$WINDOWS_INSTALL_SELECTED"
            exit 1
          fi
